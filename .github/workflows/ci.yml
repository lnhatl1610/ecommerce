name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --workspace=backend exec prisma validate
      - run: npm --workspace=backend exec prisma generate
      - run: npm run check
      - run: npm test
      - run: npm --workspace=dashboard run build
      - run: npm --workspace=web run build
