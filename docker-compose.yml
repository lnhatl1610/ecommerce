services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ecommerce"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
      PORT: 3000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET}
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
      COOKIE_SECURE: "false"
    depends_on: { postgres: { condition: service_healthy } }
  dashboard:
    build: ./dashboard
    ports: ["8081:80"]
    depends_on: [api]
  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]
volumes: { postgres_data: {} }
